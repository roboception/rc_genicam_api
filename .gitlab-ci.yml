before_script:
  - export DISTRO_CODENAME=`lsb_release -cs` && echo Using distro $DISTRO_CODENAME
  - echo -e "\e[0Ksection_start:`date +%s`:install_debs\r\e[0KInstall dependencies"
  - export DEBIAN_FRONTEND=noninteractive
  - command -v curl > /dev/null || (apt-get update -yq && apt-get install -y --no-install-recommends curl)
  - echo "deb http://apt.roboception.de/backports $DISTRO_CODENAME main" > /etc/apt/sources.list.d/roboception-backports.list
  - echo "deb http://apt.roboception.de/stable $DISTRO_CODENAME main" > /etc/apt/sources.list.d/roboception-stable.list
  - if [ "$TESTING_DEBS" = "true" ]; then echo "deb http://apt.roboception.de/testing $DISTRO_CODENAME main" > /etc/apt/sources.list.d/roboception-testing.list ; fi
  - curl -fsSL http://apt.roboception.de/archive.key -o /etc/apt/trusted.gpg.d/roboception.asc
  - apt-get update -yq && apt-get install -y --no-install-recommends lintian git rc-sbom-tools libusb-1.0 libpng-dev libncurses-dev
  - echo -e "\e[0Ksection_end:`date +%s`:install_debs\r\e[0K"

variables:
  GET_SOURCES_ATTEMPTS: "3"
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: "recursive"

